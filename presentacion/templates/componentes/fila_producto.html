<tbody id="producto-{{ producto.id }}">
    <tr>
        <td>{{ producto.nombre }}</td>
        <td>{{ producto.precio }}</td>
        <td>{{ producto.cantidad }}</td>
        <td>{{ producto.descripcion or "" }}</td>
        <td>
            <button
                hx-get="/productos/{{ producto.id }}/editar"
                hx-target="#producto-{{ producto.id }}"
                hx-swap="outerHTML">
                Editar
            </button>
            <button
                hx-delete="/productos/{{ producto.id }}"
                hx-target="#producto-{{ producto.id }}"
                hx-swap="outerHTML"
                hx-confirm="¿Seguro que quieres eliminar este producto?">
                Borrar
            </button>
        </td>
    </tr>
</tbody>
